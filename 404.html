<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background: #fafcff;
      color: #172a3a;
    }
    main {
      max-width: 600px;
      margin: 100px auto;
    }
    h1 {
      font-size: 48px;
      margin: 0 0 20px;
      color: #244bdb;
    }
    p {
      font-size: 16px;
      margin: 0 0 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #244bdb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>찾으시는 페이지가 없습니다.</p>
    <a href="/">홈으로 가기</a>
  </main>
</body>
</html>
